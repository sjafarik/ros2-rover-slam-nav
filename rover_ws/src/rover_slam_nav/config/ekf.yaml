ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    publish_tf: true

    map_frame: map
    odom_frame: rover_robot/odom
    base_link_frame: rover_robot/body
    world_frame: rover_robot/odom

    odom0: /model/rover_robot/odometry

    # Order of variables in *_config:
    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    #
    # true  = use this variable from the sensor
    # false = ignore this variable from the sensor
    odom0_config: [
      false,  false,  false,
      false, false, false,
      true,  false,  false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_relative: false

    imu0: /imu

    # Same variable order:
    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true